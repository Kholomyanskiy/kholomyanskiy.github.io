<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
{{hreflang}}<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<!-- @include head-common -->
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="img/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="img/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
{{jsonld}}<style>
/* @include common.css */
.topnav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1.5px solid var(--ink);padding:0}
.topnav-links{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.topnav-links a{color:var(--ink-soft);text-decoration:none;letter-spacing:.03em}
.topnav-links a:hover{color:var(--blue)}
@media(max-width:680px){.topnav-links{gap:14px;font-size:12px}}

.tb-main{padding:44px 32px 36px}
.tb-main h1{font-family:'Spectral',serif;font-weight:700;font-size:clamp(26px,4.5vw,38px);line-height:1.2;max-width:680px}
.article-meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:.03em;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.article-meta a{color:var(--blue)}
.tb-main .article-meta:first-child{margin:0 0 16px}

h2{font-family:'Spectral',serif;font-weight:600;font-size:25px;margin-bottom:14px}
a{color:var(--blue)}

.prose{max-width:660px}
.prose h2{font-size:23px;margin-top:8px}
.prose p{margin-bottom:16px}
.prose ul{margin:0 0 16px 22px}
.prose li{margin-bottom:6px}
.prose hr{border:none;border-top:1px solid var(--line);margin:32px 0}
.prose strong{font-weight:600}

.footer-links a{color:var(--ink);text-decoration:none;letter-spacing:.03em}
.footer-links a:hover{color:var(--blue)}
footer a{color:var(--ink);text-decoration:none;font-weight:500}
footer a:hover{color:var(--blue);text-decoration:underline}

@media(max-width:680px){
 section,.tb-main{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<!-- @include topnav -->

<div class="sheet">

 <header class="titleblock">
 <div class="tb-top">
 <span class="brand">EVAI CONSULTING</span>
 <span>Elbląg, Poland</span>
 </div>
 <div class="tb-main">
 <div class="article-meta"><a href="{{hub_url}}">{{back_label}}</a></div>
 <h1>{{h1}}</h1>
 </div>
 </header>

 <section>
 <div class="prose">
{{body}}
 </div>
 </section>

</div>

<!-- @include footer -->

</body>
</html>
